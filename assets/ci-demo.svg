<svg xmlns="http://www.w3.org/2000/svg" width="976" height="908" viewBox="0 0 976 908" role="img" aria-labelledby="t d">
<title id="t">vulnwrench ci on the bundled synthetic scanner reports</title>
<desc id="d">Terminal output of vulnwrench ci on examples/ci: a noise funnel from 37 raw findings from Trivy, Grype and OSV-Scanner to 2 that need action, the two exploitable findings with their follow-up commands, one finding without exploit data, three stale exceptions, the findings below the exploit threshold and the failing gate. Generated by assets/render_terminal.py.</desc>
<style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;font-size:13px;fill:#d9dde3;white-space:pre}.b{font-weight:700;fill:#ffffff}.d{fill:#8a919c}.c31{fill:#ff7b72}.c32{fill:#7ee787}.c33{fill:#e3b341}.c34{fill:#79c0ff}.c35{fill:#d2a8ff}.c36{fill:#76d4e8}.title{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;fill:#8a919c}</style>
<rect x="0.5" y="0.5" width="975" height="907" rx="10" fill="#14171c" stroke="#3a404a"/>
<path d="M0.5 32 V10.5 a10 10 0 0 1 10 -10 H965.5 a10 10 0 0 1 10 10 V32 Z" fill="#1d2128"/>
<line x1="0.5" y1="32" x2="975.5" y2="32" stroke="#3a404a"/>
<circle cx="20" cy="16.0" r="5.5" fill="#ff5f57"/>
<circle cx="38" cy="16.0" r="5.5" fill="#febc2e"/>
<circle cx="56" cy="16.0" r="5.5" fill="#28c840"/>
<text class="title" x="488.0" y="20.0" text-anchor="middle">examples/ci  —  synthetic scanner reports, offline</text>
<text y="59" xml:space="preserve"><tspan x="18.0" class="b c32">$</tspan><tspan x="33.7" class="b">vulnwrench ci --trivy trivy.json --grype grype.json --osv osv.json --baseline baseline.json --ignores .trivyignore</tspan></text>
<text y="76" xml:space="preserve"><tspan x="49.3" class="b">--ignores osv-scanner.toml --epss epss.csv --kev kev.json --as-of 2026-11-12 --reports-unfiltered</tspan></text>
<text y="93" xml:space="preserve"><tspan x="18.0" class="b">vulnwrench ci</tspan><tspan x="135.4" class="d">3 reports (grype, osv, trivy) · baseline baseline.json · 2 exception files · as of 2026-11-12</tspan></text>
<text y="127" xml:space="preserve"><tspan x="18.0" class="b">Noise funnel</tspan></text>
<text y="144" xml:space="preserve"><tspan x="49.3" class="b">37</tspan><tspan x="80.6">raw findings from 3 scanners</tspan></text>
<text y="161" xml:space="preserve"><tspan x="49.3" class="b">14</tspan><tspan x="80.6">unique after fuse (same package + advisory alias)</tspan><tspan x="487.8" class="d">-23 duplicates</tspan></text>
<text y="178" xml:space="preserve"><tspan x="57.1" class="b">8</tspan><tspan x="80.6">new since the baseline</tspan><tspan x="487.8" class="d">-6 already in baseline</tspan></text>
<text y="195" xml:space="preserve"><tspan x="57.1" class="b">6</tspan><tspan x="80.6">not covered by an unexpired exception</tspan><tspan x="487.8" class="d">-2 suppressed</tspan></text>
<text y="212" xml:space="preserve"><tspan x="57.1" class="b">2</tspan><tspan x="80.6">exploitable: in KEV or EPSS &gt;= 0.1</tspan><tspan x="487.8" class="d">-3 below threshold, -1 no exploit data</tspan></text>
<text y="246" xml:space="preserve"><tspan x="18.0" class="b">Needs action (2)</tspan></text>
<text y="263" xml:space="preserve"><tspan x="33.7" class="c31">✗</tspan><tspan x="49.3" class="b">pkg:npm/acme-router@4.2.0</tspan><tspan x="260.7" class="c31">CVE-2099-2001</tspan><tspan x="378.2">HIGH</tspan><tspan x="425.2" class="c31">in KEV</tspan><tspan x="487.8" class="d">fix 4.2.3</tspan></text>
<text y="280" xml:space="preserve"><tspan x="57.1" class="d">seen by grype, osv, trivy · package-lock.json</tspan></text>
<text y="297" xml:space="preserve"><tspan x="57.1" class="c36">vulnwrench fuse explain --trivy trivy.json --grype grype.json --osv osv.json --advisory CVE-2099-2001 --package</tspan></text>
<text y="314" xml:space="preserve"><tspan x="88.5" class="c36">pkg:npm/acme-router@4.2.0</tspan></text>
<text y="331" xml:space="preserve"><tspan x="33.7" class="c31">✗</tspan><tspan x="49.3" class="b">pkg:npm/acme-session@1.8.0</tspan><tspan x="268.6" class="c31">CVE-2099-2002</tspan><tspan x="386.0">CRITICAL</tspan><tspan x="464.3" class="c31">EPSS 0.62</tspan><tspan x="550.4" class="d">fix 1.8.4, 1.9.0 (scanners disagree)</tspan></text>
<text y="348" xml:space="preserve"><tspan x="57.1" class="d">seen by grype, osv, trivy · package-lock.json</tspan></text>
<text y="365" xml:space="preserve"><tspan x="57.1" class="c36">vulnwrench fuse explain --trivy trivy.json --grype grype.json --osv osv.json --advisory CVE-2099-2002 --package</tspan></text>
<text y="382" xml:space="preserve"><tspan x="88.5" class="c36">pkg:npm/acme-session@1.8.0</tspan></text>
<text y="416" xml:space="preserve"><tspan x="18.0" class="b">No exploit data (1)</tspan><tspan x="182.4" class="d">map non-CVE IDs with --aliases, refresh old snapshots, or review by hand</tspan></text>
<text y="433" xml:space="preserve"><tspan x="33.7" class="c33">?</tspan><tspan x="49.3" class="b">pkg:npm/acme-color@0.3.0</tspan><tspan x="252.9" class="c33">GHSA-w2bb-c4hq-2005</tspan><tspan x="417.3">MEDIUM</tspan><tspan x="480.0" class="c33">no CVE ID</tspan><tspan x="566.1" class="d">fix 0.3.1</tspan></text>
<text y="450" xml:space="preserve"><tspan x="57.1" class="d">seen by grype, osv · package-lock.json</tspan></text>
<text y="467" xml:space="preserve"><tspan x="57.1" class="c36">vulnwrench fuse explain --trivy trivy.json --grype grype.json --osv osv.json --advisory GHSA-w2bb-c4hq-2005</tspan></text>
<text y="484" xml:space="preserve"><tspan x="88.5" class="c36">--package pkg:npm/acme-color@0.3.0</tspan></text>
<text y="518" xml:space="preserve"><tspan x="18.0" class="b">Stale exceptions (3)</tspan></text>
<text y="535" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3" class="b">.trivyignore line:2</tspan><tspan x="213.8">CVE-2099-1004</tspan><tspan x="331.2" class="c33">expired 2026-10-31; no longer suppresses pkg:pypi/acme-xml@0.9.1 (already in</tspan></text>
<text y="552" xml:space="preserve"><tspan x="65.0" class="c33">baseline)</tspan></text>
<text y="569" xml:space="preserve"><tspan x="57.1" class="c36">vulnwrench ignores explain --format trivy --rules .trivyignore --report trivy.json --report-unfiltered --as-of</tspan></text>
<text y="586" xml:space="preserve"><tspan x="88.5" class="c36">2026-11-12 --rule-key line:2</tspan></text>
<text y="603" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3" class="b">.trivyignore line:3</tspan><tspan x="213.8">CVE-2099-2006</tspan><tspan x="331.2" class="c33">expires in 18 days; then unhides pkg:pypi/acme-zip@3.3.3 (EPSS 0.71)</tspan></text>
<text y="620" xml:space="preserve"><tspan x="57.1" class="c36">vulnwrench ignores explain --format trivy --rules .trivyignore --report trivy.json --report-unfiltered --as-of</tspan></text>
<text y="637" xml:space="preserve"><tspan x="88.5" class="c36">2026-11-12 --rule-key line:3</tspan></text>
<text y="654" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3" class="b">.trivyignore line:4</tspan><tspan x="213.8">CVE-2099-0777</tspan><tspan x="331.2" class="c33">matches nothing in these reports</tspan></text>
<text y="671" xml:space="preserve"><tspan x="57.1" class="c36">vulnwrench ignores cleanup-plan --format trivy --rules .trivyignore --report trivy.json --report-unfiltered --as-of</tspan></text>
<text y="688" xml:space="preserve"><tspan x="88.5" class="c36">2026-11-12 --output-format markdown</tspan></text>
<text y="705" xml:space="preserve"><tspan x="33.7" class="d">4 of 4 exceptions name no owner: `vulnwrench triage` keeps owner, reason and expiry in one decision file.</tspan></text>
<text y="739" xml:space="preserve"><tspan x="18.0" class="b">New but below the exploit threshold (3)</tspan><tspan x="339.0" class="d">not gated</tspan></text>
<text y="756" xml:space="preserve"><tspan x="33.7" class="d">· pkg:npm/acme-auth@2.2.0</tspan><tspan x="245.1" class="d">CVE-2099-2007</tspan><tspan x="362.5" class="d">HIGH</tspan><tspan x="409.5" class="d">EPSS 0.09</tspan><tspan x="495.6" class="d">fix 2.2.1</tspan></text>
<text y="773" xml:space="preserve"><tspan x="33.7" class="d">· pkg:pypi/acme-csv@2.0.1</tspan><tspan x="245.1" class="d">CVE-2099-2003</tspan><tspan x="362.5" class="d">MEDIUM</tspan><tspan x="425.2" class="d">EPSS 0.03</tspan><tspan x="511.3" class="d">fix 2.0.2</tspan></text>
<text y="790" xml:space="preserve"><tspan x="33.7" class="d">· pkg:npm/acme-log@7.1.0</tspan><tspan x="237.2" class="d">CVE-2099-2004</tspan><tspan x="354.7" class="d">LOW</tspan><tspan x="393.8" class="d">EPSS 0.01</tspan><tspan x="480.0" class="d">fix 7.1.1</tspan></text>
<text y="824" xml:space="preserve"><tspan x="18.0" class="d">2 baseline finding(s) are no longer reported. Not reported is not fixed: confirm upgrades with `vulnwrench delta</tspan></text>
<text y="841" xml:space="preserve"><tspan x="49.3" class="d">compare` and both SBOMs.</tspan></text>
<text y="875" xml:space="preserve"><tspan x="18.0">37 raw findings from 3 scanners -&gt;</tspan><tspan x="292.1" class="c31">2 need action</tspan><tspan x="393.8">.</tspan></text>
<text y="892" xml:space="preserve"><tspan x="18.0">--fail-on exploitable:</tspan><tspan x="198.1" class="c31">FAIL (exit 1, 2 findings)</tspan></text>
</svg>
